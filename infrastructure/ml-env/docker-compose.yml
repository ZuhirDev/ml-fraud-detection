services:
  ml-env:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-env:latest
    container_name: ml-env
    env_file:
      - ../../.env
    ports:
      - "8888:8888"
    volumes:
      - ../../data:/app/data
      - ../../models:/app/models
      - ../../notebooks:/app/notebooks
      - ../../src:/app/src
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/app/src
    networks:
      - shared-ml-network

  neo4j:
    image: neo4j:2025.09.0-enterprise-bullseye
    container_name: neo4j
    env_file:
      - ../../.env
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7473:7473"   # Bloom (HTTPS)
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "apoc-extended","graph-data-science", "bloom", "genai"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ../../data-neo:/data
      - ../../logs:/logs
      - ../../plugins:/plugins
    networks:
      - shared-ml-network

networks:
  shared-ml-network:
    external: true